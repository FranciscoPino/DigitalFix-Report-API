spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: ms-digitalfix-report
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092,localhost:19093,localhost:19094}
    listener:
      ack-mode: record
    consumer:
      group-id: ${KAFKA_GROUP_ID:digitalfix-report}
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:digitalfix}?sslmode=${DB_SSL_MODE:require}
    username: ${DB_USER:digitalfix_admin}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
server:
  port: ${SERVER_PORT:8084}
